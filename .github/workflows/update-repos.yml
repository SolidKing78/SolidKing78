name: Update Repo Showcase

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  update-repos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate repo cards
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { data: repos } = await github.rest.repos.listForUser({
              username: 'SolidKing78',
              type: 'public',
              sort: 'updated',
              per_page: 100
            });

            const profileRepo = 'SolidKing78';
            const publicRepos = repos.filter(r => !r.private && r.name !== profileRepo);

            let cards = '';
            for (const repo of publicRepos) {
              const lang = repo.language ? encodeURIComponent(repo.language) : 'Code';
              const desc = (repo.description || 'Public repository').slice(0, 80);
              cards += `<a href="${repo.html_url}"><img src="https://img.shields.io/badge/${encodeURIComponent(repo.name)}-${lang}-c9a962?style=for-the-badge&labelColor=0a0a0f" alt="${repo.name}"/></a> &nbsp; \n\n`;
              cards += `${desc}\n\n`;
              cards += `⭐ ${repo.stargazers_count} · 🍴 ${repo.forks_count} · [Repo →](${repo.html_url})\n\n---\n\n`;
            }

            if (publicRepos.length === 0) {
              cards = '<img src="https://readme-typing-svg.demolab.com?font=Fira+Code&size=14&duration=2800&pause=1500&color=c9a962&center=true&width=520&lines=Henuz+proje+reposu+yok;Yeni+repo+eklendiginde+otomatik+buraya+duser" alt="Repo placeholder"/>\n';
            }

            const readme = fs.readFileSync('README.md', 'utf8');
            const start = '<!-- REPOS:START -->';
            const end = '<!-- REPOS:END -->';
            const updated = readme.replace(
              new RegExp(`${start}[\\s\\S]*?${end}`),
              `${start}\n${cards}${end}`
            );
            fs.writeFileSync('README.md', updated);

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update public repo showcase cards"
          git push
