name: Update Repo Showcase

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  update-repos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate repo pin cards
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { data: repos } = await github.rest.repos.listForUser({
              username: 'SolidKing78',
              type: 'public',
              sort: 'updated',
              per_page: 100
            });

            const profileRepo = 'SolidKing78';
            const publicRepos = repos.filter(r => !r.private && r.name !== profileRepo);

            let cards = '';
            for (const repo of publicRepos) {
              cards += `<img width="415" src="https://github-readme-stats.vercel.app/api/pin/?username=SolidKing78&repo=${repo.name}&theme=transparent&hide_border=true&bg_color=0a0a0f&title_color=c9a962&icon_color=8892b0&text_color=e8e8e8&border_radius=14&description_lines=3"/>\n\n`;
            }

            if (publicRepos.length === 0) {
              cards = '<img src="https://readme-typing-svg.demolab.com?font=Fira+Code&size=14&duration=2800&pause=1500&color=c9a962&center=true&width=520&lines=Hen%C3%BCz+proje+reposu+yok+%E2%9A%A1;Yeni+repo+eklendi%C4%9Finde+otomatik+buraya+d%C3%BC%C5%9Fecek"/>\n';
            }

            const readme = fs.readFileSync('README.md', 'utf8');
            const start = '<!-- REPOS:START -->';
            const end = '<!-- REPOS:END -->';
            const updated = readme.replace(
              new RegExp(`${start}[\\s\\S]*?${end}`),
              `${start}\n${cards}${end}`
            );
            fs.writeFileSync('README.md', updated);

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update public repo showcase cards"
          git push
